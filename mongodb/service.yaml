apiVersion: v1
kind: Service
metadata: 
  name: mongodb-headless-service
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev 
spec:
  clusterIP: None
  selector:
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev
  ports:
  - name: mongodb
    protocol: TCP
    port: 27017  #service port
    targetPort: 27017 #container Port

