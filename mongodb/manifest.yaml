apiVersion: apps/v1
kind: StatefulSet
metadata:
   name: mongodb
   namespace: roboshop
   labels:
     project: Roboshop
     tier: database
     component: mongodb
     environment: dev
spec:
   serviceName: mongodb-headless-service
   replicas: 
   selector:
      matchLabels:
        project: Roboshop
        tier: database
        component: mongodb
        environment: dev
   template:
      metadata:
        labels:
          project: Roboshop
          tier: database
          component: mongodb
          environment: dev
      spec:
        containers:
        - name: mongodb
          image: devzonefun/mongodb:2.0.0
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
   volumeClaimTemplates:
   - metadata:
       name: mongodb
     spec:
       accessModes: ["ReadWriteOnce"]
       storageClass: roboshop-ebs
       resources:
         requests:
           storage: 1Gi
  




      