apiVersion: apps/v1
kind: Deployment
metadata:
   name: mongodb
   namespace: roboshop

   labels:
     project: Roboshop
     tier: database
     component: mongodb
     environment: dev
spec:
   replicas: 1
   selector:
      matchLabels:
        project: Roboshop
        tier: database
        component: mongodb
        environment: dev
   template:
      metadata:
        labels:
          project: Roboshop
          tier: database
          component: mongodb
          environment: dev
      spec:
        containers:
        - name: mongodb
          image: devzonefun/mongodb:2.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev 
spec:
  selector:
    project: Roboshop
    tier: database
    component: mongodb
    environment: dev
  ports:
  - name: mongodb
    protocol: TCP
    port: 27017  #service port
    targetPort: 27017 #container Port

      