apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
  namespaceSelector:
    matchNames:
      - roboshop
  endpoints:
  - port: http
    path: /
    interval: 15s