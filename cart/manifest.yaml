apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: Roboshop
    tier: backend
    component: cart
    environment: dev 
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: Roboshop
    tier: backend
    component: cart
    environment: dev 
spec:
  replicas: 1
  selector: 
    matchLabels:
      project: Roboshop
      tier: backend
      component: cart
      environment: dev 
  template:
    metadata:
      labels:
        project: Roboshop
        tier: backend
        component: cart
        environment: dev 
    spec:
      containers:
      - name: cart
        image: devzonefun/cart:2.0.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "150m"
            memory: "128Mi"
        readinessProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 2
          periodSeconds: 10
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 2
          periodSeconds: 10
          initialDelaySeconds: 15
        envFrom:
         - configMapRef:
             name: cart
