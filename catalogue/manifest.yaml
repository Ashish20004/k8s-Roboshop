apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
  labels:
     project: Roboshop
     tier: backend
     component: catalogue
     environemnt: dev
data:
  MONGO: true
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
   name: catalogue
   namespace: roboshop
   labels:
     project: Roboshop
     tier: backend
     component: catalogue
     environemnt: dev
spec: 
   replicas: 1
   selector:
     matchLabels:
       project: Roboshop
       tier: backend
       component: catalogue
       environemnt: dev
   template:
     metadata:
       labels:
        project: Roboshop
        tier: backend
        component: catalogue
        environemnt: dev
     spec:
        containers:
        - name: catalogue
          image: devzonefun/catalogue:2.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "120m"
              memory: "128Mi"
          readinessProbe:
            # httpGet:
            # path: /health
            # port: 8080
            tcpSocket:
             port: 8080
            failureThreshold: 2
            periodSeconds: 10
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
            path: /health
            port: 8080
            failureThreshold: 2
            periodSeconds: 10
          envFrom:
          - configMapRef:
              name: catalogue
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: Roboshop
    tier: backend
    component: catalogue
    environemnt: dev
spec:
  selector:
    project: Roboshop
    tier: backend
    component: catalogue
    environemnt: dev
  ports:
  - name: catalogue
    protocol: TCP
    port: 8080
    targetPort: 8080