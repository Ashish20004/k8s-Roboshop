apiVersion: apps/v1
kind: Deployment
metadata:
   name: mysql
   namespace: roboshop

   labels:
     project: Roboshop
     tier: database
     component: mysql
     environment: dev
spec:
   replicas: 1
   selector:
      matchLabels:
        project: Roboshop
        tier: database
        component: mysql
        environment: dev
   template:
      metadata:
        labels:
          project: Roboshop
          tier: database
          component: mysql
          environment: dev
      spec:
        containers:
        - name: mysql
          image: devzonefun/mysql:2.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: mysql
    environment: dev 
spec:
  selector:
    project: Roboshop
    tier: database
    component: mysql
    environment: dev
  ports:
  - name: mysql
    protocol: TCP
    port: 3306  #service port
    targetPort: 3306 #container Port

      