apiVersion: apps/v1
kind: StatefulSet
metadata:
   name: mysql
   namespace: roboshop
   labels:
     project: Roboshop
     tier: database
     component: mysql
     environment: dev
spec:
   serviceName: mysql-headless-service
   replicas: 1
   selector:
      matchLabels:
        project: Roboshop
        tier: database
        component: mysql
        environment: dev
   template:
      metadata:
        labels:
          project: Roboshop
          tier: database
          component: mysql
          environment: dev
      spec:
        containers:
        - name: mysql
          image: devzonefun/mysql:2.0.0
          volumeMounts:
          - name: mysql
            mountPath: /var/lib/mysql
   volumeClaimTemplates:
   - metadata:
      name: mysql
     spec:
       accessModes: ["ReadWriteOnce"]
       storageClassName: roboshop-ebs
       resources:
         requests:
           storage: 1Gi
  