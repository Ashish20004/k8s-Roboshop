apiVersion: v1
kind: Service
metadata:
  name: mysql-headless-service
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: mysql
    environment: dev 
spec:
  clusterIP: None
  selector:
    project: Roboshop
    tier: database
    component: mysql
    environment: dev
  ports:
  - name: mysql
    protocol: TCP
    port: 3306  #service port
    targetPort: 3306 #container Port
