apiVersion: apps/v1
kind: Deployment
metadata: 
  name: redis
  namespace: roboshop
  labels: 
    project: Roboshop
    tier: database
    component: redis
    environment: dev 
spec:
  replicas: 1
  selector:
     matchLabels:
       project: Roboshop
       tier: database
       component: redis
       environment: dev
  template:
    metadata:
      labels:
        project: Roboshop
        tier: database
        component: redis
        environment: dev 
    spec:
      containers:
      - name: redis
        image: redis:7.0
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: redis
    environment: dev 
spec:
  selector:
    project: Roboshop
    tier: database
    component: redis
    environment: dev 
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
  