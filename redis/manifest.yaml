apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: redis
  namespace: roboshop
  labels: 
    project: Roboshop
    tier: database
    component: redis
    environment: dev 
spec:
  serviceName: redis-headless-service
  replicas: 1
  selector:
     matchLabels:
       project: Roboshop
       tier: database
       component: redis
       environment: dev
  template:
    metadata:
      labels:
        project: Roboshop
        tier: database
        component: redis
        environment: dev 
    spec:
      containers:
      - name: redis
        image: redis:7.0
        volumeMounts:
        - name: redis
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: roboshop-ebs
      resources:
        requests:
          storage: 1gi

