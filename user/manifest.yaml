apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
  labels:
    project: Roboshop
    tier: backend
    component: user
    environment: dev 
data:
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: Roboshop
    tier: backend
    component: user
    environment: dev 
spec:
  replicas: 1
  selector: 
    matchLabels:
      project: Roboshop
      tier: backend
      component: user
      environment: dev 
  template:
    metadata:
      labels:
        project: Roboshop
        tier: backend
        component: user
        environment: dev 
    spec:
      containers:
      - name: cart
        image: devzonefun/user:2.0.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "150m"
            memory: "128Mi"
        readinessProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 2
          periodSeconds: 10
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 2
          periodSeconds: 10
          initialDelaySeconds: 15
        envFrom:
         - configMapRef:
             name: cart
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
    project: Roboshop
    tier: backend
    component: user
    environment: dev 
spec:
  selector:
    project: Roboshop
    tier: backend
    component: user
    environment: dev 
  ports:
  - name: user
    protocol: TCP
    port: 8080
    targetPort: 8080
    
         
    
    