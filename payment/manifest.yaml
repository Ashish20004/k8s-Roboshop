apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
  labels:
     project: Roboshop
     tier: backend
     component: payment
     environment: dev
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  AMQP_USER: "roboshop"
  AMQP_PASS: "roboshop123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
   name: payment
   namespace: roboshop
   labels:
     project: Roboshop
     tier: backend
     component: payment
     environment: dev
spec: 
   replicas: 1
   selector:
     matchLabels:
       project: Roboshop
       tier: backend
       component: payment
       environment: dev
   template:
     metadata:
       labels:
        project: Roboshop
        tier: backend
        component: payment
        environment: dev
     spec:
        containers:
        - name:  payment
          image: devzonefun/payment:2.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150"
              memory: "256Mi"
          readinessProbe:
            # httpGet:
            # path: /health
            # port: 8080
            tcpSocket:
             port: 8080
            failureThreshold: 2
            periodSeconds: 10
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 2
            periodSeconds: 10
            initialDelaySeconds: 15
          envFrom:
          - configMapRef:
              name: payment
