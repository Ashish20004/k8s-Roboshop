apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: rabbitmq
    environment: dev
spec: 
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: database
      component: rabbitmq
      environment: dev
  template:
    metadata:
      labels:
        project: Roboshop
        tier: database
        component: rabbitmq
        environment: dev
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
      
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: rabbitmq
    environment: dev
spec:
  selector:
    project: roboshop
    tier: database
    component: rabbitmq
    environment: dev
  ports:
  - name: rabbitmq
    protocol: TCP
    port: 5672
    targetPort: 5672
      
