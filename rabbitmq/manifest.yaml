apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: rabbitmq
    environment: dev
data:
  RABBITMQ_DEFAULT_USER: roboshop
  RABBITMQ_DEFAULT_PASS: roboshop123
---

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: rabbitmq
    environment: dev
spec:
  serviceName: rabbitmq-headless-service 
  replicas: 1
  selector:
    matchLabels:
      project: Roboshop
      tier: database
      component: rabbitmq
      environment: dev
  template:
    metadata:
      labels:
        project: Roboshop
        tier: database
        component: rabbitmq
        environment: dev
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        envFrom:
        - configMapRef:
            name: rabbitmq
        volumeMounts:
        - name: rabbitmq
          mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: roboshop-ebs
      resources:
        requests: 
          storage: 1Gi
