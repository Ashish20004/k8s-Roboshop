apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless-service
  namespace: roboshop
  labels:
    project: Roboshop
    tier: database
    component: rabbitmq
    environment: dev
spec:
  clusterIP: None
  selector:
    project: Roboshop
    tier: database
    component: rabbitmq
    environment: dev
  ports:
  - name: rabbitmq
    protocol: TCP
    port: 5672
    targetPort: 5672
      
