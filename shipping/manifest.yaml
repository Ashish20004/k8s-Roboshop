apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop
  labels:
     project: Roboshop
     tier: backend
     component: shipping
     environment: dev
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"

---
apiVersion: apps/v1
kind: Deployment
metadata:
   name: shipping
   namespace: roboshop
   labels:
     project: Roboshop
     tier: backend
     component: shipping
     environment: dev
spec: 
   replicas: 1
   selector:
     matchLabels:
       project: Roboshop
       tier: backend
       component: shipping
       environment: dev
   template:
     metadata:
       labels:
        project: Roboshop
        tier: backend
        component: shipping
        environment: dev
     spec:
        containers:
        - name:  shipping
          image: devzonefun/shipping:2.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            # httpGet:
            # path: /health
            # port: 8080
            tcpSocket:
             port: 8080
            failureThreshold: 2
            periodSeconds: 10
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 2
            periodSeconds: 10
            initialDelaySeconds: 15
          envFrom:
          - configMapRef:
              name: shipping
